[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tstdx"
version = "1.1.0"
description = "Provider-first market-data runtime and TDX protocol toolkit with explicit Providers, direct Provider reads, Stateful streaming and canonical HTTP/WebSocket/MCP adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tstdx contributors" }]
keywords = [
    "tdx", "通达信", "quotation", "stock", "a-share", "kline",
    "market-data", "protocol", "vipdoc", "realtime",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
config    = ["pydantic>=2.5"]
dataframe = ["pandas>=2.0"]
parquet   = ["pyarrow>=14.0"]
duckdb    = ["duckdb>=0.10"]
# Concrete HTTP Provider adapters (Tencent/Sina/Eastmoney/Baidu etc.).
web       = ["httpx>=0.26"]
tools     = ["tzdata>=2024.1; sys_platform == 'win32'"]
metrics   = ["prometheus-client>=0.19"]
# Canonical /v13 HTTP + /v13/ws transports. The asyncio.server API used by the
# canonical WS transport is part of the modern websockets API.
server    = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=13.0"]
# MCP stdio packaging/integration extra.
mcp       = ["mcp>=1.0"]
dev       = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # Exact pins, on purpose: `ruff format` output and `mypy` error sets are
    # version-sensitive, and floating ranges turned the format/type gates into
    # drift reports (V17 F-15). Upgrade deliberately, in its own commit.
    "ruff==0.15.2",
    "mypy==2.3.1",
    "hatchling>=1.25",
]
all       = [
    "pydantic>=2.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "httpx>=0.26",
    "prometheus-client>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=13.0",
    "mcp>=1.0",
    "zstandard>=0.22",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage      = "https://github.com/coeasy/tstdx"
Documentation = "https://github.com/coeasy/tstdx/tree/main/docs"
Issues        = "https://github.com/coeasy/tstdx/issues"
Changelog     = "https://github.com/coeasy/tstdx/blob/main/CHANGELOG.md"
Releases      = "https://github.com/coeasy/tstdx/releases"

[project.scripts]
tstdx = "tstdx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tstdx"]

[tool.hatch.build.targets.sdist]
include = [
    "tstdx",
    "PROTOCOL_SPEC",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "docs/releases/v1.0.0.md",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "unit: 纯单元测试，无网络无 IO",
    "integration: 集成/loopback 测试；network marker 才表示外网依赖",
    "golden: Golden 数据回放测试",
    "slow: 耗时较长的测试",
    "network: 需要访问外部网络",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# 代码生成草稿区（auto-generated，不进包内），不纳入 lint
extend-exclude = ["tstdx/tools/generated_draft"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tstdx/protocol/parsers/*" = ["E501"]
# Package __init__ modules intentionally define lazy/re-export API surfaces.
"tstdx/cli/__init__.py" = ["F401"]
"tstdx/client/__init__.py" = ["F401"]
"tstdx/web/base.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "httpx.*",
    "fastapi.*",
    "uvicorn.*",
    "pyarrow.*",
    "pandas.*",
    "websockets.*",
    "prometheus_client.*",
    "duckdb.*",
    "zstandard.*",
    "tomli",
    "tomllib",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tstdx"]
branch = true

[tool.coverage.report]
# Coverage gate: single source of truth. Makefile and CI invoke pytest without
# --cov-fail-under because pytest-cov reads this value; the no-duplication rule
# is pinned by tests/compatibility/test_local_gate_contract.py. It may be raised
# only from measured exact-head evidence in the CI environment, never lowered or
# bypassed to make a refactor green.
fail_under = 77
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
