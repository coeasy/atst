# =============================================================================
# LOGOUT — 交易登出
# =============================================================================
# 命令号: 0x0003
# 家族:  TRADE 交易协议族
# 层级:  L1（自洽帧布局）
# 状态:  draft（洁净室推断占位）
#
# 描述: 客户端主动结束交易会话；服务端关闭连接并回收会话资源。
#       本命令在模拟器中仅作会话复位（登出后需重新登录方可操作）。
# =============================================================================

spec_id: "0x0003"
name: "logout"
family: "TRADE"
version: "0.1"
description: "Trade session logout"
status: "draft"
aliases: ["trade_logout"]

# =============================================================================
# 请求体
# =============================================================================
request:
  length: 0
  fields: []

# =============================================================================
# 响应体
# =============================================================================
response:
  header: []
  fields: []
  record_size: 0
  encoding: "raw"
  notes: "服务端成功登出后通常直接断开连接，无业务响应体。"

# =============================================================================
# 上下文
# =============================================================================
context:
  port: 7702
  header_layout: "8 字节: <H total_len><H cmd><H seq><H flags|status>"

notes: |
  登出帧通常无业务响应体；客户端发完即关闭连接。
  模拟器（TradeSimulator.logout）负责将会话置为未登录态。
