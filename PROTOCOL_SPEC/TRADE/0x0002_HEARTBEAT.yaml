# =============================================================================
# HEARTBEAT — 交易心跳保活
# =============================================================================
# 命令号: 0x0002
# 家族:  TRADE 交易协议族
# 层级:  L1（自洽帧布局，模拟器回路验证）
# 状态:  draft（洁净室推断占位）
#
# 描述: 客户端周期性发送心跳保持会话活性；服务端回 <B 1> 表示连接正常。
# =============================================================================

spec_id: "0x0002"
name: "heartbeat"
family: "TRADE"
version: "0.1"
description: "Trade session heartbeat keep-alive"
status: "draft"
aliases: ["trade_heartbeat"]

# =============================================================================
# 请求体
# =============================================================================
request:
  length: 0
  fields: []

# =============================================================================
# 响应体
# =============================================================================
response:
  header: []
  fields:
    - name: "ok"
      offset: 0
      type: "uint8"
      length: 1
      description: "1=连接正常 / 0=异常"
  record_size: 1
  encoding: "raw"

# =============================================================================
# 上下文
# =============================================================================
context:
  port: 7702
  header_layout: "8 字节: <H total_len><H cmd><H seq><H flags|status>"

notes: |
  心跳通常由客户端按固定间隔主动发送；服务端不主动推送。
  实现参考: tstdx/trade/frames.py (build_heartbeat_response / parse_heartbeat_response)
