# =============================================================================
# EX_BATCH_QUOTE — 扩展市场批量报价
# =============================================================================
# 命令号: 0x0109
# 家族:  7727 扩展市场协议族
# 层级:  L2 (洁净室推断，合成载荷锁定)
# 状态:  inferred
#
# 描述: 批量报价，每条复用 ExInstrumentQuoteParser（0x0105 布局）。
#
# ⚠️ 已知洁净室局限: 单条报价尾部（五档盘口）布局未锁定，会贪婪消费到
#    缓冲末尾 → 多记录载荷只能解析出首条并触发「记录截断」告警。
#    真实批量记录定长/结束标记待真机样本锁定，不可在无样本时臆造长度。
# =============================================================================

spec_id: "0x0109"
name: "ex_batch_quote"
family: "7727"
version: "1.0"
description: "Extended market batch quote"
status: "inferred"

request:
  length: 9
  fields:
    - name: "market"
      offset: 0
      type: "uint16"
      length: 2
      description: "市场 ID"
    - name: "code"
      offset: 2
      type: "string[6]"
      length: 6
      description: "品种代码（首只）"
      format: "gbk"
    - name: "count"
      offset: 8
      type: "uint8"
      length: 1
      description: "批量条数"

response:
  header:
    - name: "record_count"
      offset: 0
      type: "uint16"
      length: 2
      description: "声明记录条数"
  fields:
    - name: "record"
      type: "raw"
      description: "单条报价（复用 0x0105 布局，变长）"
      notes: "每条实际为 0x0105 布局；因尾部贪婪消费，当前只能解析首条"
  record_size: null
  encoding: "diff"

context:
  price_scale: 100
  known_limitation: true
  notes: |
    现状由 test_7727_goods_mac_coverage.py::TestExExtendedLayout::
    test_0109_batch_quote_known_single_record_limitation 锁定
    （期望 len(rows)==1 + 「记录截断」告警）。真机样本到位后翻转。

warnings:
  - description: "Single-record-only due to greedy tail"
    detail: "尾部五档盘口布局未锁定 → 批量解析只出首条，禁止臆造记录长度"

notes: |
  洁净室推断布局，尚未 golden 回归。

parser_reference: "tstdx/protocol/parsers/std7727.py::ExBatchQuoteParser"
