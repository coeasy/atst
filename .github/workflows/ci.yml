name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC — full deterministic gate suite

# Only the newest run for the same event/ref can be merge evidence. Cancel stale
# PR/push runs so obsolete SHAs do not consume runner capacity while preserving
# scheduled runs as a separate concurrency class.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install canonical dev toolchain
        run: python -m pip install -e ".[dev]"
      - name: Run ruff check
        run: python -m ruff check atst/ tests/ scripts/
      - name: Run ruff format check
        run: python -m ruff format --check atst/ tests/ scripts/

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install canonical dev toolchain
        run: python -m pip install -e ".[dev]"
      - name: Run mypy
        run: python -m mypy atst/ --ignore-missing-imports --no-error-summary --warn-unused-ignores

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install package and canonical test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run tests
        run: >-
          python -m pytest tests/ -v --tb=short -m "not network"
          --cov=atst
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  originality:
    name: Originality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run originality check
        run: python -m atst.tools.check_originality --strict atst/

  spec-coverage:
    name: Spec Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run spec audit
        run: python -m atst.tools.spec_audit --json --strict

  bridges:
    name: Bridge Audit (24 items)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install canonical test dependencies
        run: python -m pip install -e ".[dev]"
      # #17 验收 `atst.integration.runtime_http.create_runtime_app()` 的路由表，
      # 而 fastapi 是**惰性**导入的可选依赖（在 `server` extra 里）——只装 `.[dev]`
      # 时该用例会以 ModuleNotFoundError -> RuntimeError 直接失败。`.[dev]` 保持原样
      # 是为了继续满足 test_ci_workflow_contracts 对声明式工具链的计数判据。
      - name: Install the optional faces this audit exercises
        run: python -m pip install -e ".[server]"
      - name: Run bridges test
        run: python -m pytest tests/test_bridges.py -v --tb=short

  golden-gate:
    name: Golden Gate (L1 real-sample, 三旗标)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Golden origin audit + L1 real-sample gate
        run: >-
          python -m atst.tools.golden_audit --gate --require-markets
          --require-kline-categories 0,4,9 --require-payloads

  adversarial-matrix:
    name: Adversarial Payload Matrix (native escape = 0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package and canonical test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run matrix gate (strict-L1 + degraded + canary)
        run: python -m pytest tests/adversarial -q --tb=short

  reachability:
    name: Module Reachability (orphans = 0 unregistered)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: AST reachability scan (strict)
        run: python scripts/audit_reachability.py --strict

  benchmark-smoke:
    name: Benchmark Smoke (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run deterministic benchmark smoke
        run: python scripts/run_benchmark_smoke.py

  interface-surface:
    name: Interface Surface (argparse)
    # Parses the whole CLI surface with --help. Purely local (no socket is
    # opened), so it can be part of the deterministic merge gate: it fails only
    # when a subcommand/subaction is unreachable or its signature regressed.
    # Live call-level probing lives in live-smoke.yml, which must tolerate
    # transient network failures.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Probe the whole argparse surface
        run: python scripts/verify_interfaces.py --mode argparse

  docs-links:
    name: Docs link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check repository-bounded relative links in docs
        run: python scripts/check_docs_links.py
