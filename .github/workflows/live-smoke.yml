name: Live Smoke

# G2: network tests stay outside the pull-request merge gate so transient public
# network failures cannot make deterministic source CI flaky. The scheduled run
# itself must still be truthful: a failed live probe makes this workflow red and
# always leaves a JUnit artifact for diagnosis/monitoring.
#
# G4: the daily 01:00 UTC run is *before* the A-share session, so it can never
# see a live quote or a forming minute bar. The weekday 02:30 UTC run (10:30
# Beijing, morning session) is what makes tests/live/test_tdx_core_chain.py --
# the only 7709 assertions the pipeline runs -- actually intraday-capable.
on:
  schedule:
    - cron: '0 1 * * *'  # daily 01:00 UTC, before A-share trading
    - cron: '30 2 * * 1-5'  # weekdays 02:30 UTC = 10:30 Beijing, morning session
  workflow_dispatch:

# A second daily/manual probe supersedes an older one; never keep multiple live
# network diagnostics running concurrently.
concurrency:
  group: live-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live Smoke (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and canonical test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run network tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --tb=short -m "network" \
            --junitxml=reports/live-smoke.xml
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-report-${{ github.run_number }}
          path: reports/live-smoke.xml
          if-no-files-found: warn
          retention-days: 14
