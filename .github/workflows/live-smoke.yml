name: Live Smoke

# G2: network tests stay outside the pull-request merge gate so transient public
# network failures cannot make deterministic source CI flaky. The scheduled run
# itself must still be truthful: a failed live probe makes this workflow red and
# always leaves a JUnit artifact for diagnosis/monitoring.
on:
  schedule:
    - cron: '0 1 * * *'  # daily 01:00 UTC, before A-share trading
  workflow_dispatch:

# A second daily/manual probe supersedes an older one; never keep multiple live
# network diagnostics running concurrently.
concurrency:
  group: live-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live Smoke (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and canonical test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run network tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --tb=short -m "network" \
            --junitxml=reports/live-smoke.xml
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report-${{ github.run_number }}
          path: reports/live-smoke.xml
          if-no-files-found: warn
          retention-days: 14
