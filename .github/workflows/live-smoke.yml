name: Live Smoke

# G2（docs/ARCHITECTURE_AND_OPTIMIZATION_PLAN_v6 §4）：
# 联网冒烟测试从主干 ci.yml 的 test job 中拆出，定时独立执行。
# 目的：让主干 CI 幂等（不依赖外网），同时保留对真实数据源的定期探活。
# 失败不阻断主干合并 —— 仅产出可追溯的 run 报告供人工判断。

on:
  schedule:
    - cron: '0 1 * * 1,2,3,4,5,6,0'  # 每日 01:00 UTC（避开 A 股交易时段）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live Smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install package
        run: |
          pip install -e ".[all]"
          pip install pytest
      - name: Run network tests (non-blocking)
        continue-on-error: true
        run: pytest tests/ -v --tb=short -m "network"
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: |
            .pytest_cache/**/lastfailed
            reports/
          if-no-files-found: ignore
