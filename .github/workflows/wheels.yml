name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # B12（REFACTOR_PLAN_v7 §2.9）：manylinux 合规 wheel——
  # cibuildwheel 产出 manylinux2014 标签（旧 glibc 环境可安装），× x86_64/aarch64，
  # 并在 manylinux 容器内做安装冒烟。macOS/Windows 保留原 build 流程
  # （纯 Python 包无 ABI 依赖，无需 cibuildwheel）。
  build-wheels:
    name: Build wheels (Linux manylinux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheels (cp310–cp313)
        uses: pypa/cibuildwheel@v2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_ARCHS: auto64
          CIBW_TEST_COMMAND: python -c "import tstdx; print(tstdx.__version__)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build-wheels-macos:
    name: Build wheels (macOS)
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.python-version }}
          path: dist/*.whl

  build-wheels-windows:
    name: Build wheels (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.python-version }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [build-wheels, build-wheels-macos, build-wheels-windows]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      # 信任发布（OIDC）：不传 password，PyPI 按 environment=pypi 的
      # Trusted Publisher 映射校验身份（Q3）。
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [build-wheels, build-wheels-macos, build-wheels-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build
        run: pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: Publish Docker image to Docker Hub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tstdx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
