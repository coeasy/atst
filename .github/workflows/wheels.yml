name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

# Never run two release pipelines for the same ref concurrently. Do not cancel an
# in-flight publication: a newer invocation must wait rather than interrupting a
# potentially irreversible external publish operation.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

# Pure-Python release workflow. Build one canonical universal wheel/sdist, then
# install that exact artifact across the supported OS/Python matrix before a
# single trusted-publishing step. Manual dispatch is build/verification only.
permissions:
  contents: read

jobs:
  build-dist:
    name: Build canonical wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Verify release tag matches canonical source identity
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from scripts.build_package import _declared_versions

          project_version, source_version = _declared_versions()
          assert source_version == project_version, (
              f"source version {source_version!r} != project version {project_version!r}"
          )
          expected = f"v{project_version}"
          actual = os.environ["RELEASE_TAG"]
          assert actual == expected, f"release tag {actual!r} != package {expected!r}"
          print("release source/tag identity OK:", actual)
          PY
      - name: Install packaging validators
        run: python -m pip install build twine
      - name: Build canonical distributions
        run: python -m build
      - name: Verify source, wheel, sdist, PEP 561 and Twine metadata
        run: python scripts/build_package.py --verify-only --dist-out dist
      - name: Upload canonical distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    name: Install artifact (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      # Artifact-only job: intentionally no source checkout. setup-python pip
      # caching is also intentionally disabled because v5 requires a repository
      # dependency file for the cache key and would fail before wheel install.
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the exact built wheel
        run: >-
          python -m pip install --no-index --find-links dist
          --only-binary=:all: tstdx
      - name: Verify installed public surface and CLI entrypoints
        run: |
          python -c "import importlib.metadata as m, tstdx; assert tstdx.__version__ == m.version('tstdx'); print(tstdx.__version__)"
          python -c "from importlib.resources import files; assert files('tstdx').joinpath('py.typed').is_file()"
          python -c "from tstdx.tools.host_audit import AuditReport, audit_all; assert callable(audit_all); print(AuditReport.__name__)"
          python -c "from tstdx.transport import ConnectionPool; assert ConnectionPool.request.__module__ == 'tstdx.transport._pool_hardening'; assert ConnectionPool.request_multi.__module__ == 'tstdx.transport._pool_hardening'; assert ConnectionPool.update_hosts.__module__ == 'tstdx.transport._pool_provenance_hardening'; assert ConnectionPool._trigger_background_speedtest.__module__ == 'tstdx.transport._pool_provenance_hardening'"
          python -c "from tstdx.transport import RankingStore; assert RankingStore.load.__module__ == 'tstdx.transport._ranking_hardening'; assert RankingStore.save.__module__ == 'tstdx.transport._ranking_hardening'"
          python -c "from tstdx.transport.async_ import AsyncConnectionPool; assert AsyncConnectionPool.request.__module__ == 'tstdx.transport._async_pool_hardening'; assert AsyncConnectionPool.update_hosts.__module__ == 'tstdx.transport._pool_provenance_hardening'; assert callable(getattr(AsyncConnectionPool, '_circuit_allows', None)); assert callable(getattr(AsyncConnectionPool, '_release_probe_token', None))"
          tstdx --help
          tstdx hosts audit --help
          python -m pip check

  publish-pypi:
    name: Publish canonical distributions to PyPI
    needs: [build-dist, smoke-install]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish once with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-release-assets:
    name: Attach canonical packages to GitHub Release
    needs: [build-dist, smoke-install, publish-pypi]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Verify canonical release asset count
        shell: bash
        run: |
          set -euo pipefail
          wheel_count="$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')"
          sdist_count="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          test "$wheel_count" = 1
          test "$sdist_count" = 1
      - name: Upload canonical packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-docker:
    name: Publish Docker image to Docker Hub
    # Prevent Docker publication when either PyPI or the GitHub Release asset
    # surface failed. All external surfaces consume the same canonical artifact.
    needs: [build-dist, smoke-install, publish-pypi, publish-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Reuse the exact wheel that passed the 12-cell install matrix. The release
      # image must not rebuild a second wheel from source and accidentally diverge
      # from the artifact published to PyPI.
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tstdx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - name: Build and push canonical-artifact image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
