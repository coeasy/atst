name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

# Pure-Python release workflow. Build one canonical universal wheel/sdist, then
# install that exact artifact across the supported OS/Python matrix before a
# single trusted-publishing step. Manual dispatch is build/verification only.
permissions:
  contents: read

jobs:
  build-dist:
    name: Build canonical wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = str(tomllib.load(stream)["project"]["version"])
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          assert actual == expected, f"release tag {actual!r} != package {expected!r}"
          print("release identity OK:", actual)
          PY
      - name: Install build validators
        run: python -m pip install build twine
      - name: Build canonical distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Require one universal wheel and one sdist
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]
          print("release artifacts:", wheels[0].name, sdists[0].name)
          PY
      - name: Upload canonical distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  smoke-install:
    name: Install artifact (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      # Artifact-only job: intentionally no source checkout. setup-python pip
      # caching is also intentionally disabled because v5 requires a repository
      # dependency file for the cache key and would fail before wheel install.
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the exact built wheel
        run: python -m pip install --no-index --find-links dist tstdx
      - name: Verify import, metadata and CLI entrypoint
        run: |
          python -c "import importlib.metadata as m, tstdx; assert tstdx.__version__ == m.version('tstdx'); print(tstdx.__version__)"
          tstdx --help
          python -m pip check

  publish-pypi:
    name: Publish canonical distributions to PyPI
    needs: [build-dist, smoke-install]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish once with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    name: Publish Docker image to Docker Hub
    needs: [build-dist, smoke-install]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Reuse the exact wheel that passed the 12-cell install matrix. The release
      # image must not rebuild a second wheel from source and accidentally diverge
      # from the artifact published to PyPI.
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tstdx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - name: Build and push canonical-artifact image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
