name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 独立于 wheels.yml 的 Rust 内核构建与对拍自检。
# 运行时仍保留 tstdx_native -> pure Python 的安全降级；但 CI 必须阻塞：
# PR 的合并门禁明确要求 Native build/parity 与其它 gate 在同一 SHA 绿色，
# 因此这里不能用 continue-on-error 把未执行/编译失败伪装成 workflow success。
permissions:
  contents: read

jobs:
  build-native:
    name: Build & parity-check tstdx_native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install "maturin>=1.4,<2.0"

      - name: Build native wheel
        run: maturin build --release --manifest-path tstdx_native/Cargo.toml

      - name: Install native wheel
        run: pip install tstdx_native/target/wheels/*.whl

      - name: Run parity self-test (pure Python reference)
        # 从仓库根目录外的临时目录运行，避免 `tstdx_native/` 源码目录
        # 作为命名空间包遮蔽已安装的编译扩展。
        working-directory: /tmp
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from tstdx.native import selftest
          result = selftest()
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result["importable"] or not result["native_available"]:
              raise SystemExit("tstdx_native build/parity gate failed")
          PY
