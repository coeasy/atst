name: Native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest run for the same event/ref can be merge evidence. Cancel stale
# PR/push runs so retired-native compatibility checks do not queue for old SHAs.
concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# tstdx_native source was retired before v1.4.0 and has never existed in this
# repository history. Keep this as a blocking compatibility/provenance gate:
# the deprecated tstdx.native facade must remain pure-Python, must not activate
# an unrelated environment package named tstdx_native, and its fallback paths
# must remain in parity with the canonical Python implementations.
permissions:
  contents: read

jobs:
  native-compat:
    name: Native compatibility & fallback parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package and canonical test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile compatibility surface
        run: python -m compileall -q tstdx/native.py
      - name: Run retired-native compatibility gate
        run: >-
          python -W default -m pytest
          tests/compatibility/test_native_fallback_contract.py
          -q --tb=short
      - name: Print fallback parity diagnostic
        run: |
          python -W ignore::UserWarning - <<'PY'
          import json
          from tstdx.native import selftest

          result = selftest()
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result["native_available"] is False
          assert result["fallback_parity"] is True
          PY
