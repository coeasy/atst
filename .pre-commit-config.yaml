# Fast commit-time subset of the blocking CI contract.
# Install through `make install`, then enable with `pre-commit install`.
# Full tests/coverage/Golden/benchmark gates remain in `make gates` and CI.
repos:
  - repo: local
    hooks:
      - id: atst-ruff-check
        name: atst ruff check
        entry: python -m ruff check atst/ tests/ scripts/
        language: system
        pass_filenames: false
        types: [python]

      - id: atst-ruff-format
        name: atst ruff format check
        entry: python -m ruff format --check atst/ tests/ scripts/
        language: system
        pass_filenames: false
        types: [python]

      - id: atst-mypy
        name: atst mypy contract
        entry: python -m mypy atst/ --ignore-missing-imports --no-error-summary --warn-unused-ignores
        language: system
        pass_filenames: false
        types: [python]

      - id: atst-originality
        name: atst originality gate
        entry: python -m atst.tools.check_originality --strict atst/
        language: system
        pass_filenames: false
        types: [python]

      - id: atst-spec-audit
        name: atst strict spec-to-implementation audit
        entry: python -m atst.tools.spec_audit --json --strict
        language: system
        pass_filenames: false
        files: ^(atst/protocol|PROTOCOL_SPEC)/

      - id: atst-doc-links
        name: atst repository-bounded docs links
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^PROTOCOL_SPEC/.*
      - id: check-json
        exclude: ^ops/grafana_dashboard\.json$
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: check-merge-conflict
      - id: check-case-conflict
