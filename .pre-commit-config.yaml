# pre-commit 钩子 —— 原创性门禁 + 基础卫生检查
# 安装: pip install pre-commit && pre-commit install
# 手动全量: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: tstdx-originality
        name: tstdx 原创性门禁（AST 相似度 + 拷贝指纹 + license 白名单）
        entry: python -m tstdx.tools.check_originality --strict tstdx
        language: system
        pass_filenames: false
        types: [python]

      - id: tstdx-spec-audit
        name: tstdx spec↔实现反向校验（ledger/解析器覆盖率）
        entry: python -m tstdx.tools.spec_audit
        language: system
        pass_filenames: false
        files: ^(tstdx/protocol|PROTOCOL_SPEC)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^PROTOCOL_SPEC/.*
      - id: check-json
        exclude: ^ops/grafana_dashboard\.json$
      - id: end-of-file-fixer
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: trailing-whitespace
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: check-merge-conflict
      - id: check-case-conflict
