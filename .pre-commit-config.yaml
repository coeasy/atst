# Fast commit-time subset of the blocking CI contract.
# Install through `make install`, then enable with `pre-commit install`.
# Full tests/coverage/Golden/benchmark/native gates remain in `make gates` and CI.
repos:
  - repo: local
    hooks:
      - id: tstdx-ruff-check
        name: tstdx ruff check
        entry: python -m ruff check tstdx/ tests/ scripts/
        language: system
        pass_filenames: false
        types: [python]

      - id: tstdx-ruff-format
        name: tstdx ruff format check
        entry: python -m ruff format --check tstdx/ tests/ scripts/
        language: system
        pass_filenames: false
        types: [python]

      - id: tstdx-mypy
        name: tstdx mypy contract
        entry: python -m mypy tstdx/ --ignore-missing-imports --no-error-summary --warn-unused-ignores
        language: system
        pass_filenames: false
        types: [python]

      - id: tstdx-originality
        name: tstdx originality gate
        entry: python -m tstdx.tools.check_originality --strict tstdx/
        language: system
        pass_filenames: false
        types: [python]

      - id: tstdx-spec-audit
        name: tstdx strict spec-to-implementation audit
        entry: python -m tstdx.tools.spec_audit --json --strict
        language: system
        pass_filenames: false
        files: ^(tstdx/protocol|PROTOCOL_SPEC)/

      - id: tstdx-doc-links
        name: tstdx repository-bounded docs links
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^PROTOCOL_SPEC/.*
      - id: check-json
        exclude: ^ops/grafana_dashboard\.json$
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(tests/golden|PROTOCOL_SPEC/UNKNOWN)/
      - id: check-merge-conflict
      - id: check-case-conflict
