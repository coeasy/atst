# Compose v2 不再需要顶层 version（'3.8' 只产生 obsolete 警告）。
services:
  atst:
    build: .
    container_name: atst
    ports:
      - "8000:8000"
    # ATST_* 是保留命名空间：ATST_LOG_LEVEL / ATST_CACHE_DIR 既不在配置 schema，
    # 也不在 loader 的 runtime 白名单，设置后 config_from_env() 直接 ConfigError；
    # 本库也没有读取它们的逻辑，因此不要在这里声明（日志级别用容器运行参数控制）。
    command: ["atst", "serve", "--bind", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  atst-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atst-dev
    ports:
      # atst 服务已占用宿主 8000；这里用 8001 暴露同一个容器端口 8000，避免 `up` 时冲突。
      - "8001:8000"
      # WS JSON-RPC 面现在由 `atst serve --ws` 同进程拉起，并共用 --bind 作为 WS host；
      # 本 compose 未带 --ws（缺省仅 HTTP）。若改用单进程
      # `python -m atst.server.runtime_ws_server`，其默认 host 仍是 127.0.0.1:8765，
      # 需在 RuntimeWsConfig 里改成 0.0.0.0 并放行端口：
      # - "8765:8765"
    environment:
      # ATST_FEEDBACK 是登记过的 runtime 白名单变量；0 = 不启用上报。
      - ATST_FEEDBACK=0
    volumes:
      - .:/app
    # `python -m atst.cli` 跑不起来（第 23 轮实测 rc=1：No module named atst.cli.__main__）；
    # `python -m atst` 才是与控制台脚本等价的那一条。
    command: ["python", "-m", "atst", "serve", "--bind", "0.0.0.0", "--port", "8000"]
    restart: on-failure
